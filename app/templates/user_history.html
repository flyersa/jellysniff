{% extends "base.html" %}
{% block title %}History — JellySniff{% endblock %}
{% block content %}
<div x-data="myHistory()" x-init="load()">
  <div class="flex items-end justify-between mb-6">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Watch history</h1>
      <p class="text-zinc-500 text-sm mt-1">
        <span x-show="data?.total" x-text="`${(data?.total || 0).toLocaleString()} plays total`"></span>
      </p>
    </div>
    <div class="flex items-center gap-2">
      <input x-model="filter" type="search" placeholder="Filter…"
             class="bg-zinc-900 border border-zinc-800 px-3 py-1.5 text-sm w-48 focus:outline-none focus:border-accent">
      <select x-model="days" @change="page=1; load()"
              class="bg-zinc-900 border border-zinc-800 text-sm px-2 py-1.5">
        <option value="30">30 days</option>
        <option value="90">90 days</option>
        <option value="365">365 days</option>
        <option value="3650">all time</option>
      </select>
      <select x-model="pageSize" @change="page=1; load()"
              class="bg-zinc-900 border border-zinc-800 text-sm px-2 py-1.5">
        <option value="25">25/page</option>
        <option value="50">50/page</option>
        <option value="100">100/page</option>
        <option value="250">250/page</option>
      </select>
    </div>
  </div>
  <div class="panel">
    <table class="w-full text-sm">
      <colgroup>
        <col style="width:140px"><col><col style="width:80px"><col style="width:120px"><col style="width:110px"><col style="width:130px"><col style="width:80px">
      </colgroup>
      <thead><tr class="text-xs uppercase tracking-wider text-zinc-500 border-b border-zinc-800">
        <th class="py-2 px-3 text-left">When</th>
        <th class="py-2 px-3 text-left">Title</th>
        <th class="py-2 px-3 text-left">Type</th>
        <th class="py-2 px-3 text-left">Method</th>
        <th class="py-2 px-3 text-left">Client</th>
        <th class="py-2 px-3 text-left">Device</th>
        <th class="py-2 px-3 text-right">Duration</th>
      </tr></thead>
      <tbody>
        <template x-for="h in filtered()" :key="`${h.DateCreated}|${h.ItemId}`">
          <tr class="border-b border-zinc-900 hover:bg-zinc-900/50">
            <td class="py-2 px-3 text-zinc-400 font-mono text-xs whitespace-nowrap" :title="fmtDateFull(h.DateCreated)" x-text="fmtDateRelative(h.DateCreated)"></td>
            <td class="py-2 px-3"><div class="flex items-center gap-2 min-w-0">
              <a :href="`/item/${h.ItemId}`" class="shrink-0"><img :src="`/img/${h.ItemId}?w=80`" loading="lazy" class="w-8 h-12 object-cover bg-zinc-900" data-img-fallback="hide"></a>
              <a :href="`/item/${h.ItemId}`" class="cell-truncate-inline hover:text-accent-bright" :title="h.ItemName" x-text="h.ItemName"></a></div></td>
            <td class="py-2 px-3 text-zinc-400" x-text="h.ItemType"></td>
            <td class="py-2 px-3 text-zinc-400 text-xs cell-truncate" :title="h.PlaybackMethod" x-text="h.PlaybackMethod"></td>
            <td class="py-2 px-3 text-zinc-400 cell-truncate" :title="h.ClientName" x-text="h.ClientName"></td>
            <td class="py-2 px-3 text-zinc-400 cell-truncate" :title="h.DeviceName" x-text="h.DeviceName"></td>
            <td class="py-2 px-3 text-right tabular-nums" x-text="fmtDur(h.PlayDuration)"></td>
          </tr>
        </template>
        <tr x-show="!loading && filtered().length === 0">
          <td colspan="7" class="text-center py-8 text-zinc-500">No history in this window.</td>
        </tr>
      </tbody>
    </table>
    <div class="px-3 py-2 border-t border-zinc-800 flex items-center justify-between text-xs">
      <span class="text-zinc-500" x-show="data?.total" x-text="rangeLabel()"></span>
      <div class="flex items-center gap-1">
        <button class="px-2 py-1 hover:bg-zinc-800 disabled:opacity-30" :disabled="page <= 1" @click="goto(1)">« first</button>
        <button class="px-2 py-1 hover:bg-zinc-800 disabled:opacity-30" :disabled="page <= 1" @click="goto(page-1)">‹ prev</button>
        <span class="px-2 text-zinc-400 tabular-nums" x-text="`page ${page} / ${data?.pages || 1}`"></span>
        <button class="px-2 py-1 hover:bg-zinc-800 disabled:opacity-30" :disabled="page >= (data?.pages || 1)" @click="goto(page+1)">next ›</button>
        <button class="px-2 py-1 hover:bg-zinc-800 disabled:opacity-30" :disabled="page >= (data?.pages || 1)" @click="goto(data?.pages || 1)">last »</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script nonce="{{ request.state.csp_nonce }}">
function myHistory() {
  return {
    days: 90, pageSize: 50, page: 1,
    data: { history: [], total: 0, pages: 1 }, filter: '', loading: false,
    fmtDur(s) { return window.fmtDuration(s || 0); },
    fmtDateFull(s) { return window.fmtDateFull(s); },
    fmtDateRelative(s) { return window.fmtDateRelative(s); },
    filtered() {
      const f = this.filter.trim().toLowerCase();
      if (!f) return this.data.history;
      return this.data.history.filter(r => (r.ItemName || '').toLowerCase().includes(f));
    },
    rangeLabel() {
      const t = this.data?.total || 0;
      if (!t) return '';
      const start = (this.page - 1) * this.pageSize + 1;
      const end = Math.min(t, start + (this.data?.history?.length || 0) - 1);
      return `${start.toLocaleString()}–${end.toLocaleString()} of ${t.toLocaleString()}`;
    },
    goto(p) { this.page = p; this.load(); },
    async load() {
      this.loading = true;
      const r = await fetch(`/api/me/history?days=${this.days}&limit=${this.pageSize}&page=${this.page}`);
      if (r.ok) this.data = await r.json();
      this.loading = false;
      window.scrollTo({ top: 0, behavior: 'instant' });
    },
  };
}
</script>
{% endblock %}
