{% extends "base.html" %}
{% block title %}Users — JellySniff{% endblock %}
{% block content %}
<div x-data="usersPage()" x-init="load()">
  <div class="flex items-end justify-between mb-6">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Users</h1>
      <p class="text-zinc-500 text-sm mt-1">Sort any column. Click a row to drill in.</p>
    </div>
    <div class="flex items-center gap-2">
      <input x-model="filter" type="search" placeholder="Filter…"
             class="bg-zinc-900 border border-zinc-800 px-3 py-1.5 text-sm w-48 focus:outline-none focus:border-accent">
      <select x-model="days" @change="load()"
              class="bg-zinc-900 border border-zinc-800 text-sm px-2 py-1.5">
        <option value="7">7 days</option>
        <option value="30">30 days</option>
        <option value="90">90 days</option>
        <option value="365">365 days</option>
        <option value="3650">all time</option>
      </select>
    </div>
  </div>
  <div class="panel">
    <table class="w-full text-sm">
      <colgroup>
        <col><col style="width:90px"><col style="width:160px"><col style="width:90px"><col style="width:110px"><col style="width:120px">
      </colgroup>
      <thead><tr class="text-xs uppercase tracking-wider text-zinc-500 border-b border-zinc-800">
        <th class="py-2 px-3 text-left"><span class="sort-btn" :class="{active: sortKey==='Username'}" @click="setSort('Username')">Username <span class="arrow" x-text="sortArrow('Username')"></span></span></th>
        <th class="py-2 px-3 text-left"><span class="sort-btn" :class="{active: sortKey==='IsAdmin'}" @click="setSort('IsAdmin')">Role <span class="arrow" x-text="sortArrow('IsAdmin')"></span></span></th>
        <th class="py-2 px-3 text-left"><span class="sort-btn" :class="{active: sortKey==='LastActivityDate'}" @click="setSort('LastActivityDate')">Last seen <span class="arrow" x-text="sortArrow('LastActivityDate')"></span></span></th>
        <th class="py-2 px-3 text-right"><span class="sort-btn" :class="{active: sortKey==='Plays'}" @click="setSort('Plays')">Plays <span class="arrow" x-text="sortArrow('Plays')"></span></span></th>
        <th class="py-2 px-3 text-right"><span class="sort-btn" :class="{active: sortKey==='TotalSeconds'}" @click="setSort('TotalSeconds')">Watched <span class="arrow" x-text="sortArrow('TotalSeconds')"></span></span></th>
        <th class="py-2 px-3 text-right"><span class="sort-btn" :class="{active: sortKey==='DistinctItems'}" @click="setSort('DistinctItems')">Distinct items <span class="arrow" x-text="sortArrow('DistinctItems')"></span></span></th>
      </tr></thead>
      <tbody>
        <template x-for="u in filtered()" :key="u.Id">
          <tr class="border-b border-zinc-900 hover:bg-zinc-900/50 cursor-pointer"
              @click="window.location = `/admin/users/${u.Id}`">
            <td class="py-2 px-3 text-zinc-200 cell-truncate" :title="u.Username" x-text="u.Username"></td>
            <td class="py-2 px-3">
              <span x-show="u.IsAdmin" class="text-accent text-xs uppercase tracking-wider">admin</span>
              <span x-show="!u.IsAdmin" class="text-zinc-500 text-xs uppercase tracking-wider">user</span>
            </td>
            <td class="py-2 px-3 text-zinc-400" :title="fmtDateFull(u.LastActivityDate)" x-text="fmtDateRelative(u.LastActivityDate)"></td>
            <td class="py-2 px-3 text-right tabular-nums" x-text="u.Plays"></td>
            <td class="py-2 px-3 text-right tabular-nums text-zinc-300" x-text="fmtDur(u.TotalSeconds)"></td>
            <td class="py-2 px-3 text-right tabular-nums" x-text="u.DistinctItems"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script nonce="{{ request.state.csp_nonce }}">
function usersPage() {
  return {
    days: 30, filter: '', data: { users: [] },
    sortKey: 'TotalSeconds', sortDir: 'desc',
    fmtDur(s) { return window.fmtDuration(s || 0); },
    fmtDateRelative(s) { return window.fmtDateRelative(s); },
    fmtDateFull(s) { return window.fmtDateFull(s); },
    sortArrow(k) { return this.sortKey === k ? (this.sortDir === 'desc' ? '▼' : '▲') : '↕'; },
    setSort(k) {
      if (this.sortKey === k) this.sortDir = (this.sortDir === 'desc' ? 'asc' : 'desc');
      else { this.sortKey = k; this.sortDir = (typeof (this.data.users[0]?.[k]) === 'number') ? 'desc' : 'asc'; }
    },
    filtered() {
      const f = this.filter.trim().toLowerCase();
      const rows = !f ? this.data.users : this.data.users.filter(u => (u.Username || '').toLowerCase().includes(f));
      return window.sortBy(rows, this.sortKey, this.sortDir);
    },
    async load() {
      const r = await fetch(`/api/admin/users?days=${this.days}`);
      if (!r.ok) return;
      this.data = await r.json();
    },
  };
}
</script>
{% endblock %}
